<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Carte GPX</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; font-family: sans-serif; font-size: 14px; }
    #lateral {
      width: 340px; flex-shrink: 0; overflow-y: auto;
      padding: 12px; box-sizing: border-box; border-right: 1px solid #ccc;
    }
    #map { flex: 1; }
    fieldset { border: 1px solid #ddd; margin: 10px 0; padding: 8px; }
    .ligne { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
    .ligne input[type="number"], .ligne input[type="date"], #q, #nouveau-tag {
      width: 100%; box-sizing: border-box;
    }
    #message { white-space: pre-line; margin-top: 6px; }
    #liste { list-style: none; padding: 0; margin: 0; }
    #liste li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
    #liste li:hover { background: #f1f5f9; }
    #liste li div { color: #555; font-size: 12px; margin-top: 2px; }
    .pastille {
      display: inline-block; margin: 2px 6px 2px 0; padding: 1px 6px;
      border: 1px solid #ddd; border-radius: 10px; font-size: 12px; color: #333;
    }
    .editeur-tags { margin-top: 6px; padding: 6px; background: #f8fafc; border-radius: 6px; }
    .editeur-tags label { display: block; }
      #fiche {
      display: none; position: fixed; left: 340px; right: 0; bottom: 0; z-index: 2;
      box-sizing: border-box; padding: 8px 12px; background: white;
      border-top: 1px solid #ccc; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.15);
    }
    #fiche.ouverte { display: block; }
    #fiche-entete { display: flex; justify-content: space-between; gap: 12px; }
    #fiche-stats, #profil-info { color: #555; font-size: 12px; }
    #profil-info { min-height: 16px; margin-top: 4px; }
    .curseur {
      width: 14px; height: 14px; border-radius: 50%;
      background: #1d3557; border: 2px solid white; box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }
    #filtre-categories label { display: block; }
    #fonds {
      position: fixed; top: 10px; right: 10px; z-index: 2;
      background: white; padding: 6px 10px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    #fonds label { display: block; cursor: pointer; }
  </style>
</head>
<body>
  <div id="lateral">
    <label>Importer des GPX : <input type="file" id="fichier" accept=".gpx" multiple></label>
    <div id="message"></div>

    <fieldset id="filtres">
      <legend>Filtres</legend>
      <input type="text" id="q" placeholder="Rechercher par nom">
      <div class="ligne">Distance (km)
        <input type="number" id="distance-min" placeholder="min" min="0">
        <input type="number" id="distance-max" placeholder="max" min="0">
      </div>
      <div class="ligne">D+ (m)
        <input type="number" id="dplus-min" placeholder="min" min="0">
        <input type="number" id="dplus-max" placeholder="max" min="0">
      </div>
      <div class="ligne">Du <input type="date" id="date-debut"></div>
      <div class="ligne">Au <input type="date" id="date-fin"></div>
      <div class="ligne"><label><input type="checkbox" id="zone-visible"> Limiter à la zone visible</label></div>
      <div>Tags (au moins un) :</div>
      <div id="filtre-tags"></div>
      <div>Waypoints (au moins une catégorie) :</div>
      <div id="filtre-categories"></div>
      <button id="reinitialiser" type="button">Réinitialiser</button>
    </fieldset>

    <fieldset id="nouveau-tag-bloc">
      <legend>Nouveau tag</legend>
      <div class="ligne">
        <input type="text" id="nouveau-tag" placeholder="Nom du tag">
        <input type="color" id="nouvelle-couleur" value="#e63946">
        <button id="ajouter-tag" type="button">Ajouter</button>
      </div>
    </fieldset>

    <h3 id="compteur"></h3>
    <ul id="liste"></ul>
  </div>
  <div id="map"></div>
    <div id="fonds">
      <label><input type="radio" name="fond" value="osm" checked> Plan</label>
      <label><input type="radio" name="fond" value="planign"> Plan IGN (France)</label>
      <label><input type="radio" name="fond" value="ign"> Satellite IGN (France)</label>
      <label><input type="radio" name="fond" value="esri"> Satellite Esri (monde)</label>
    </div>
    <div id="fiche">
    <div id="fiche-entete">
      <div>
        <strong id="fiche-titre"></strong>
        <div id="fiche-stats"></div>
        <div id="fiche-tags"></div>
      </div>
      <button id="fiche-fermer" type="button" title="Fermer">×</button>
    </div>
    <div id="profil-info"></div>
    <div id="profil"></div>
  </div>
  <script src="app.js"></script>
  <script src="fiche.js"></script>
  <script src="waypoints.js"></script>
  <script src="fonds.js"></script>
</body>
</html>
